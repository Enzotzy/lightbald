<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Switch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="bg-bulb">
        <img id="bulb_img" src="/Imahe/bulboff.jpg"
             class="bulb_off" alt="">
    </div>

    <div class="switch">
        <button class="btn" id="btn"></button>

        <span class="bulb_on_status">ON</span>
        <span class="bulb_off_status">OFF</span>
    </div>

    <audio src="/Imahe/buttones.mp3" id="audio"></audio>
    <audio src="/Imahe/Button hummock.mp3" id="light_hum"></audio>

    <script src="light.js"></script>

</body>
</html>
